<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Hospitalar</title>

    <!-- css global -->
    <link rel="stylesheet" href="./assets/css/global.css" />
    
    <!-- espaço para links futuros de fontes, ícones, global css, etc -->

    <link rel="stylesheet" href="./components/sidebar/sidebar.css" />
    <link rel="stylesheet" href="./components/consultas/consultas.css" />

    <!-- cérebro: tyle="module" permite a divisão do js em vários arquivos menores, bem como a importação e exportação entre eles-->
